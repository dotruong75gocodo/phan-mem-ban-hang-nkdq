version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL
  database:
    image: mysql:8.0
    container_name: banhang_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "quan_ly_ban_hang"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  # 2. Server Backend (Mở cổng 5000 ra ngoài để App.js gọi tới)
  backend-app:
    build: ./backend
    container_name: banhang_backend
    ports:
      - "5000:3000" # Mở cổng 5000 ra ngoài máy thật đúng theo code App.js
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=quan_ly_ban_hang
    restart: always

  # 3. Giao diện Frontend (Mở cổng 3000 ra ngoài để bạn truy cập trang web)
  frontend-app:
    build: ./frontend
    container_name: banhang_frontend
    ports:
      - "3000:80" # Mở cổng 3000 ra ngoài để bạn vào giao diện web
    depends_on:
      - backend-app
    restart: always

volumes:
  mysql_data:
